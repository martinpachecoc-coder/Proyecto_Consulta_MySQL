<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Black Ops II Zombies - Perks</title>

    <!-- Importación de Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Archivo JavaScript principal -->
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <!-- Encabezado principal de la página -->
    <header class="encabezado text-center py-5">
        <h1 class="display-4 fw-bold">BLACK OPS II ZOMBIES</h1>
        <p class="lead mb-0">Catálogo de ventajas del modo Zombies</p>
    </header>

    <!-- Contenido principal -->
    <main class="container py-5">
        <!-- Sección que contiene el catálogo y sus herramientas -->
        <section class="contenedor">

            <h2 class="mb-4">Catálogo de Perks</h2>

            <!-- Buscador y filtros del catálogo -->
            <section class="filtros row g-3 mb-4" aria-label="Filtros de perks">

                <div class="col-12 col-md-5">
                    <label for="buscarNombre" class="form-label">
                        Buscar perk
                    </label>

                    <input
                        type="search"
                        id="buscarNombre"
                        class="form-control"
                        placeholder="Ej.: Juggernog"
                    >
                </div>

                <div class="col-12 col-md-5">
                    <label for="filtroCategoria" class="form-label">
                        Filtrar por categoría
                    </label>

                    <select id="filtroCategoria" class="form-select">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>

                <div class="col-12 col-md-2">
                    <button
                        type="button"
                        id="limpiarFiltros"
                        class="btn btn-danger w-100"
                    >
                        Limpiar
                    </button>
                </div>

            </section>

            <!-- Mensaje que informa el estado de los resultados -->
            <p id="mensaje" role="status">Cargando perks...</p>

            <!-- Tabla donde se muestran los perks obtenidos desde MySQL -->
            <div class="tabla-contenedor table-responsive">
              
                <!-- Encabezados y cuerpo de la tabla -->
                <table class="table table-dark table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Perk</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Obtención</th>
                            <th>Precio</th>
                        </tr>
                    </thead>

                    <tbody id="tablaProductos"></tbody>
                </table>

            </div>

        </section>

    </main>

    <!-- Pie de página -->
    <footer class="text-center py-4">
        <p>Proyecto académico sobre las ventajas de Call of Duty: Black Ops II Zombies.</p>
    </footer>

    <!-- Importación del JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
